<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free-video</title>
<style>
  body { font-family: sans-serif; background:#101820; color:#fff; margin:0; padding:16px; }
  h1 { text-align:center; }
  .tabs { display:flex; gap:8px; justify-content:center; margin-bottom:16px; }
  .tabs button { padding:8px 14px; border:0; border-radius:8px; background:#223; color:#fff; }
  .tabs button.on { background:#2a7fff; }
  .box { max-width:520px; margin:auto; }
  textarea, select { width:100%; padding:10px; margin:8px 0; border-radius:8px; border:0; font-size:16px; }
  textarea { height:140px; }
  .go { width:100%; padding:14px; font-size:18px; border:0; border-radius:10px; background:#18b26b; color:#fff; }
  #msg { margin-top:14px; line-height:1.8; }
  a { color:#7fd1ff; }
</style>
</head>
<body>
<h1>Free-video</h1>
<div class="tabs">
  <button class="on" data-tab="video">ویڈیو بنائیں</button>
</div>

<div class="box" id="tab-video">
  <textarea id="topic" placeholder="ٹاپک یا کہانی یہاں لکھیں"></textarea>
  <select id="mode">
    <option value="facts">معلومات</option>
    <option value="story">کہانی</option>
  </select>
  <select id="lang">
    <option value="ur">اردو</option>
    <option value="en">English</option>
  </select>
  <button class="go" id="go">ویڈیو بنائیں</button>
  <div id="msg"></div>
</div>

<script>
const REPO = 'shakeel098kpk/Free-video';
document.getElementById('go').onclick = async () => {
  const msg = document.getElementById('msg');
  const topic = document.getElementById('topic').value.trim();
  if (!topic) { msg.textContent = 'پہلے ٹاپک لکھیں'; return; }
  msg.textContent = 'بھیج رہا ہوں...';
  try {
    const r = await fetch('/api/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        topic,
        mode: document.getElementById('mode').value,
        lang: document.getElementById('lang').value
      })
    });
    const j = await r.json();
    if (j.ok) {
      msg.innerHTML = 'ویڈیو بننا شروع ہو گئی۔ تقریباً دس سے پندرہ منٹ لگیں گے۔<br>' +
        '<a target="_blank" href="https://github.com/' + REPO + '/releases">تیار ویڈیو یہاں ملے گی</a>';
    } else {
      msg.textContent = 'خرابی: ' + (j.detail || j.error || r.status);
    }
  } catch (e) {
    msg.textContent = 'رابطہ نہیں ہو سکا: ' + e;
  }
};
</script>
</body>
</html>
